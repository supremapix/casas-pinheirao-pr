    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZV7H6RCCYW"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-ZV7H6RCCYW', { send_page_view: false });

      (function () {
        var ORIGIN = location.origin;

        function routePath() {
          var h = location.hash.replace(/^#/, '');
          if (!h || h === '/') return '/';
          return h.split('?')[0];
        }
        function formNameFromRoute() {
          var p = routePath().replace(/^\//, '');
          return (p || 'home').replace(/[^a-z0-9]+/gi, '_');
        }

        var lastPath = null;
        function sendPageView() {
          var path = routePath();
          if (path === lastPath) return;
          lastPath = path;
          gtag('event', 'page_view', {
            page_location: ORIGIN + path + location.search,
            page_path: path,
            page_title: document.title
          });
        }
        sendPageView();
        window.addEventListener('hashchange', function () { setTimeout(sendPageView, 50); });
        window.addEventListener('popstate', function () { setTimeout(sendPageView, 50); });
        // O roteador do site troca a rota via history.pushState (não dispara hashchange)
        ['pushState', 'replaceState'].forEach(function (m) {
          var orig = history[m];
          history[m] = function () {
            var r = orig.apply(this, arguments);
            setTimeout(sendPageView, 50);
            return r;
          };
        });

        function clickLocation(el) {
          if (el.closest('header, nav')) return 'header';
          if (el.closest('footer')) return 'rodape';
          var n = el;
          while (n && n !== document.body) {
            var pos = getComputedStyle(n).position;
            if (pos === 'fixed' || pos === 'sticky') return 'flutuante';
            n = n.parentElement;
          }
          return 'conteudo';
        }

        function send(name, a, extra) {
          var params = {
            link_url: (a.getAttribute('href') || '').split('?')[0],
            link_text: (a.innerText || a.getAttribute('aria-label') || a.title || '').trim().slice(0, 100),
            click_location: clickLocation(a),
            page_path: routePath()
          };
          for (var k in extra) params[k] = extra[k];
          gtag('event', name, params);
        }

        document.addEventListener('click', function (e) {
          var a = e.target.closest && e.target.closest('a[href]');
          if (!a) return;
          var href = (a.getAttribute('href') || '').toLowerCase();

          if (/wa\.me|api\.whatsapp\.com|web\.whatsapp\.com|^whatsapp:/.test(href)) {
            send('whatsapp_click', a);
          } else if (href.indexOf('tel:') === 0) {
            send('phone_click', a);
          } else if (/google\.[a-z.]+\/maps|maps\.google\.|maps\.app\.goo\.gl|goo\.gl\/maps|waze\.com|maps\.apple\.com/.test(href)) {
            send('directions_click', a);
          } else if (href.indexOf('mailto:') === 0) {
            send('email_click', a);
          } else if (/instagram\.com|facebook\.com|fb\.com|youtube\.com|tiktok\.com/.test(href)) {
            var net = (href.match(/instagram|facebook|fb|youtube|tiktok/) || [''])[0];
            send('social_click', a, { social_network: net === 'fb' ? 'facebook' : net });
          } else if (/envie-seu-projeto/.test(href)) {
            send('cta_click', a, { cta_destination: 'envie_seu_projeto' });
          }
        }, true);

        var started = new WeakSet();
        document.addEventListener('input', function (e) {
          var f = e.target.form || (e.target.closest && e.target.closest('form'));
          if (!f || started.has(f)) return;
          started.add(f);
          gtag('event', 'form_start', { form_name: formNameFromRoute(), page_path: routePath() });
        }, true);

        document.addEventListener('change', function (e) {
          if (e.target.type === 'file' && e.target.files && e.target.files.length) {
            gtag('event', 'file_upload', { form_name: formNameFromRoute(), page_path: routePath() });
          }
        }, true);

        var lastLead = 0;
        document.addEventListener('submit', function (e) {
          var now = Date.now();
          if (now - lastLead < 3000) return;
          lastLead = now;
          gtag('event', 'generate_lead', {
            form_name: formNameFromRoute(),
            page_path: routePath()
          });
        }, true);
      })();
    </script>

    <style>
      .scroll-mt-header { scroll-margin-top: 100px; }
      body { font-family: 'Montserrat', sans-serif; color: #1D1D20; line-height: 1.6; }
      h1, h2, h3, h4, h5, h6 { font-family: 'Montserrat', sans-serif; font-weight: 700; color: #1D1D20; }
      .bg-concrete-pattern {
        background-color: #E5E5E5;
        background-image: radial-gradient(#707070 0.5px, transparent 0.5px);
        background-size: 20px 20px;
        opacity: 0.1;
      }
      .vertical-text { writing-mode: vertical-rl; }
      
      /* Efeitos Globais de Botões */
      button, a[class*="btn"], a[class*="bg-pinheirao-green"], a[class*="border-pinheirao-green"] {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
        overflow: hidden;
      }
      
      button:hover, a[class*="btn"]:hover, a[class*="bg-pinheirao-green"]:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 16px rgba(0,0,0,0.2);
      }
      
      button:active, a[class*="btn"]:active, a[class*="bg-pinheirao-green"]:active {
        transform: translateY(0);
        box-shadow: 0 4px 8px rgba(0,0,0,0.15);
      }
      
      /* Efeito de ondulação ao clicar */
      button::after, a[class*="btn"]::after {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        border-radius: 50%;
        background: rgba(255,255,255,0.5);
        transform: translate(-50%, -50%);
        transition: width 0.6s, height 0.6s;
      }
      
      button:active::after, a[class*="btn"]:active::after {
        width: 300px;
        height: 300px;
      }
      
      /* Animação de Scroll Reveal para Cards */
      .property-card {
        opacity: 0;
        transform: translateY(30px);
        transition: all 0.6s ease-out;
      }
      
      .property-card.visible {
        opacity: 1;
        transform: translateY(0);
      }
      
      /* Hover nos Cards */
      .property-card {
        transition: all 0.3s ease;
      }
      
      .property-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 12px 24px rgba(0,0,0,0.15);
      }
      
      .property-card img {
        transition: transform 0.5s ease;
      }
      
      .property-card:hover img {
        transform: scale(1.1);
      }
      
      /* Gradiente Animado para Botões CTA Principais */
      .btn-gradient {
        background: linear-gradient(45deg, #0BB597, #7c3aed);
        background-size: 200% 200%;
        animation: gradientShift 3s ease infinite;
      }
      
      @keyframes gradientShift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      
      /* Acessibilidade - Foco visível */
      button:focus-visible, a:focus-visible {
        outline: 3px solid #0BB597;
        outline-offset: 2px;
      }
      
      /* Contraste WCAG AA - Textos sobre fundos escuros */
      .bg-pinheirao-black, .bg-black, [class*="bg-black"] {
        color: #FFFFFF;
      }
      
      .bg-pinheirao-black h1, .bg-pinheirao-black h2, .bg-pinheirao-black h3,
      .bg-black h1, .bg-black h2, .bg-black h3 {
        color: #FFFFFF;
        font-weight: 600;
      }
      
      .bg-pinheirao-black p, .bg-black p {
        color: #E5E5E5;
      }
    </style>
