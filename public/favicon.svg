<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="pinheiraoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0BB597" />
      <stop offset="100%" stop-color="#007C73" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D1D20" />
      <stop offset="100%" stop-color="#0F1115" />
    </linearGradient>
  </defs>
  <!-- Background with subtle rounded corners -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />
  <rect width="496" height="496" x="8" y="8" rx="96" fill="none" stroke="#0BB597" stroke-width="8" stroke-opacity="0.3" />

  <!-- Iconic Pine Tree & House Silhouette of Casas Pinheirão -->
  <g transform="translate(40, 20)">
    <!-- House Roof -->
    <polygon points="216,110 390,260 350,260 216,145 82,260 42,260" fill="url(#pinheiraoGrad)" />
    
    <!-- House Base Outline -->
    <path d="M96,250 L96,400 L336,400 L336,250" fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Stylized Pine Tree (Araucária / Pinheiro do Paraná) inside the house -->
    <!-- Pine Tree Top Canopy -->
    <path d="M216,160 C235,160 250,170 270,175 C295,182 280,205 255,200 C235,196 230,205 216,205 C202,205 197,196 177,200 C152,205 137,182 162,175 C182,170 197,160 216,160 Z" fill="#0BB597" />
    <!-- Pine Tree Lower Branches -->
    <path d="M216,205 C240,205 260,218 285,224 C315,232 300,258 270,252 C245,247 235,258 216,258 C197,258 187,247 162,252 C132,258 117,232 147,224 C172,218 192,205 216,205 Z" fill="#0BB597" />
    <!-- Pine Tree Trunk -->
    <rect x="206" y="250" width="20" height="150" fill="#E5E5E5" rx="4" />
    
    <!-- Foundation / Ground Line -->
    <line x1="60" y1="400" x2="372" y2="400" stroke="url(#pinheiraoGrad)" stroke-width="24" stroke-linecap="round" />
  </g>
</svg>
